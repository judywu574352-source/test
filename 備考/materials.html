<title>材料力學 公式題庫</title>
<style>
:root{
  --bg:#efe9dc; --grid:rgba(178,164,140,.16);
  --panel:#fffdf8; --panel2:#f6f1e7; --line:#e3dbca;
  --ink:#2f2b24; --dim:#8c8473;
  --acc:#b5482e; --acc2:#2f7d8a; --teal:#1f8574; --dark:#2c2a26;
  --star:#d99a1c; --ok:#2f8f5b; --bad:#c0473f;
  --mao:#a8512f; --oy:#247064;
  --mono:"Consolas","Roboto Mono","Noto Sans Mono CJK TC",monospace;
  --sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  background:
    linear-gradient(var(--grid) 1px,transparent 1px),
    linear-gradient(90deg,var(--grid) 1px,transparent 1px),
    var(--bg);
  background-size:22px 22px,22px 22px,auto;
  color:var(--ink);font-family:var(--sans);line-height:1.6;-webkit-font-smoothing:antialiased}
.wrap{max-width:880px;margin:0 auto;padding:calc(18px + env(safe-area-inset-top)) 16px 60px}
header{border-bottom:1px solid var(--line);padding-bottom:14px;margin-bottom:16px}
h1{font-size:1.32rem;letter-spacing:.5px;display:flex;align-items:center;gap:9px;flex-wrap:wrap;color:var(--ink)}
h1 .tag{font-size:.6rem;background:var(--acc);color:#fff;padding:2px 7px;border-radius:4px;letter-spacing:1px;font-weight:700}
.sub{color:var(--dim);font-size:.82rem;margin-top:5px}
.srcline{font-size:.74rem;color:var(--dim);margin-top:6px}
.srcline b{color:var(--oy)} .srcline i{color:var(--mao);font-style:normal}
.stats{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:7px 13px;text-align:center;min-width:60px;box-shadow:0 1px 2px rgba(90,75,50,.05)}
.stat b{display:block;font-size:1.12rem;color:var(--teal)}
.stat span{font-size:.64rem;color:var(--dim);letter-spacing:1px}
.tabs{display:flex;gap:6px;margin:18px 0 14px}
.tab{flex:1;background:var(--panel);border:1px solid var(--line);color:var(--dim);padding:10px;border-radius:9px;cursor:pointer;font-size:.9rem;font-family:inherit;transition:.15s;box-shadow:0 1px 2px rgba(90,75,50,.04)}
.tab.on{background:var(--dark);color:#fff;border-color:var(--dark);font-weight:700}
.tab:focus-visible{outline:2px solid var(--acc2);outline-offset:2px}
.view{display:none}.view.on{display:block;animation:fade .25s}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1}}
.filterbar{margin-bottom:12px}
.flbl{font-size:.7rem;color:var(--dim);letter-spacing:1px;margin:8px 0 6px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:var(--panel);border:1px solid var(--line);color:var(--dim);padding:5px 11px;border-radius:20px;font-size:.78rem;cursor:pointer;font-family:inherit;transition:.12s}
.chip.on{background:var(--teal);color:#fff;border-color:var(--teal);font-weight:600}
.chip.s.on{background:var(--teal);color:#fff;border-color:var(--teal)}
.searchbox{width:100%;background:var(--panel);border:1px solid var(--line);color:var(--ink);padding:10px 13px;border-radius:9px;font-size:.9rem;font-family:inherit;margin-top:10px}
.searchbox::placeholder{color:#b3ab99}
.searchbox:focus{outline:none;border-color:var(--acc2)}
.fcard{background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:14px 15px;margin-bottom:10px;box-shadow:0 1px 3px rgba(90,75,50,.06)}
.ftop{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:2px}
.pill{font-size:.62rem;padding:2px 8px;border-radius:5px;letter-spacing:.5px;font-weight:700;white-space:nowrap}
.pill{color:var(--acc);background:rgba(189,85,48,.09);border:1px solid var(--line)}
.fname{font-weight:600;font-size:1rem;color:var(--ink)}
.fname .star{color:var(--star);margin-right:3px}
.formula{font-family:var(--mono);background:var(--panel2);border:1px solid var(--line);border-left:3px solid var(--acc);border-radius:7px;padding:10px 13px;margin-top:10px;font-size:1.02rem;color:#3c352b;overflow-x:auto;line-height:1.7}
.dnote{color:var(--dim);font-size:.82rem;margin-top:8px}
.expander{display:inline-flex;align-items:center;gap:6px;margin-top:10px;background:rgba(47,125,138,.09);border:1px solid rgba(47,125,138,.3);color:var(--acc2);padding:5px 11px;border-radius:7px;cursor:pointer;font-size:.78rem;font-family:inherit;user-select:none}
.expander .ic{font-size:.68rem;background:var(--acc2);color:#fff;padding:1px 5px;border-radius:3px;font-weight:700}
.expander:hover{background:rgba(47,125,138,.16)}
.detail{display:none;margin-top:11px;border-top:1px dashed var(--line);padding-top:11px}
.detail.on{display:block}
.vtab{width:100%;border-collapse:collapse;font-size:.82rem}
.vtab td{padding:5px 8px;border-bottom:1px solid var(--line);vertical-align:top}
.vtab tr:last-child td{border-bottom:none}
.vtab td:first-child{font-family:var(--mono);color:var(--acc2);white-space:nowrap;width:1%;font-weight:600}
.vtab td:nth-child(3){color:var(--dim);white-space:nowrap;text-align:right}
.tip{background:rgba(217,154,28,.1);border:1px solid rgba(217,154,28,.32);border-radius:7px;padding:8px 11px;margin-top:11px;font-size:.82rem;color:#7c5a18}
.tip b{color:var(--acc)}
.count{color:var(--dim);font-size:.76rem;margin:4px 2px 10px}
.qsetup{background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:15px;box-shadow:0 1px 3px rgba(90,75,50,.06)}
.row{margin-bottom:14px}
.row>label{display:block;font-size:.78rem;color:var(--dim);letter-spacing:1px;margin-bottom:7px}
.numsel{display:flex;gap:6px;flex-wrap:wrap}
.numsel button{background:var(--panel2);border:1px solid var(--line);color:var(--dim);padding:7px 14px;border-radius:8px;cursor:pointer;font-family:inherit}
.numsel button.on{background:var(--teal);color:#fff;border-color:var(--teal);font-weight:700}
.btn{background:var(--acc);color:#fff;border:none;padding:12px;border-radius:9px;font-size:.95rem;font-weight:700;cursor:pointer;width:100%;font-family:inherit}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--dim);font-weight:500}
.btn:focus-visible{outline:2px solid var(--acc2);outline-offset:2px}
.qcard{background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:15px;margin-bottom:12px;box-shadow:0 1px 3px rgba(90,75,50,.06)}
.qhead{font-size:.7rem;color:var(--dim);margin-bottom:8px;display:flex;justify-content:space-between;gap:8px}
.qtext{font-size:.95rem;margin-bottom:12px;line-height:1.5;color:var(--ink)}
.opt{display:block;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:10px 13px;margin-bottom:8px;cursor:pointer;font-size:.88rem;transition:.12s;color:var(--ink)}
.opt:hover{border-color:var(--acc2)}
.opt.sel{border-color:var(--acc2);background:rgba(47,125,138,.1)}
.opt.right{border-color:var(--ok);background:rgba(47,143,91,.13)}
.opt.wrong{border-color:var(--bad);background:rgba(192,71,63,.12)}
.opt .k{font-family:var(--mono);color:var(--acc2);margin-right:9px}
.exp{display:none;margin-top:10px;font-size:.82rem;color:var(--dim);border-top:1px dashed var(--line);padding-top:9px}
.exp.on{display:block}.exp b{color:var(--ok)}
.scorebar{background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:18px;text-align:center;margin-bottom:14px;box-shadow:0 1px 3px rgba(90,75,50,.06)}
.scorebar .big{font-size:2.2rem;color:var(--acc);font-weight:800}
.scorebar .lbl{color:var(--dim);font-size:.8rem}
.hide{display:none!important}
.fc{background:var(--panel);border:1px solid var(--line);border-radius:14px;min-height:240px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:26px;text-align:center;cursor:pointer;margin-bottom:14px;box-shadow:0 1px 4px rgba(90,75,50,.07)}
.fc .side{font-size:.66rem;color:var(--dim);letter-spacing:2px;margin-bottom:14px}
.fc .q{font-size:1.18rem;font-weight:600;color:var(--ink)}
.fc .a{font-family:var(--mono);font-size:1.08rem;color:#3c352b;margin-bottom:12px;line-height:1.7}
.fc .hint{font-size:.78rem;color:var(--acc2)}
.fcbtns{display:flex;gap:8px}
.fcbtns button{flex:1}
.fcprog{text-align:center;color:var(--dim);font-size:.78rem;margin-bottom:10px}
footer{color:var(--dim);font-size:.7rem;text-align:center;margin-top:34px;border-top:1px solid var(--line);padding-top:14px;line-height:1.7}
@media(max-width:560px){.stat{min-width:52px;padding:6px 9px}.tabs{flex-wrap:wrap}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}

function buildChips(container,state,onChange){
  container.innerHTML='';
  const all=mkChip('全部','__all',state.size===0,false);
  all.addEventListener('click',()=>{state.clear();buildChips(container,state,onChange);onChange();});
  container.appendChild(all);
  const _subs=[...new Set(CH.map(c=>c.sub))];
  const _multi=_subs.length>1;
  const _hdr={'核心':'── ★ 核心章 ──','次要':'── 次要章 ──','概覽':'── 概覽章 ──'};
  let lastSub='';
  CH.forEach(c=>{
    if(_multi&&c.sub!==lastSub){lastSub=c.sub;
      const lab=document.createElement('span');
      lab.className='flbl';lab.style.width='100%';lab.style.margin='8px 0 2px';
      lab.textContent=_hdr[c.sub]||('── '+c.sub+' ──');
      container.appendChild(lab);
    }
    const chip=mkChip(c.name,c.ch,state.has(c.ch),false);
    chip.addEventListener('click',()=>{
      if(state.has(c.ch))state.delete(c.ch);else state.add(c.ch);
      buildChips(container,state,onChange);onChange();
    });
    container.appendChild(chip);
  });
}

  const b=document.createElement('button');
  b.className='chip'+(isMat?' s':'')+(on?' on':'');
  b.textContent=text;b.dataset.k=key;return b;
}

/* READ */
const readState=new Set();
const readChips=document.getElementById('readChips');
const readList=document.getElementById('readList');
const searchEl=document.getElementById('search');
buildChips(readChips,readState,renderRead);
searchEl.addEventListener('input',renderRead);
function renderRead(){
  const kw=searchEl.value.trim().toLowerCase();
  let list=F.filter(f=>readState.size===0||readState.has(f.ch));
  if(kw)list=list.filter(f=>(f.n+f.f+f.d+f.tip+chName(f.ch)).toLowerCase().includes(kw));
  document.getElementById('readCount').textContent='顯示 '+list.length+' / '+F.length+' 條公式';
  readList.innerHTML='';
  list.forEach((f,i)=>readList.appendChild(buildFCard(f,'r'+i)));
}
function buildFCard(f,id){
  const card=document.createElement('div');card.className='fcard';
  const top=document.createElement('div');top.className='ftop';
  const pill=document.createElement('span');
  pill.className='pill';
  pill.textContent=chName(f.ch);
  const nm=document.createElement('span');nm.className='fname';
  if(f.s){const s=document.createElement('span');s.className='star';s.textContent='★';nm.appendChild(s);}
  nm.appendChild(document.createTextNode(f.n));
  top.appendChild(pill);top.appendChild(nm);
  const fo=document.createElement('div');fo.className='formula';fo.textContent=f.f;
  card.appendChild(top);card.appendChild(fo);
  if(f.d){const dn=document.createElement('div');dn.className='dnote';dn.textContent=f.d;card.appendChild(dn);}
  const exp=document.createElement('div');exp.className='expander';
  const ic=document.createElement('span');ic.className='ic';ic.textContent='代';
  exp.appendChild(ic);
  const lab=document.createElement('span');lab.textContent='展開代數意義';exp.appendChild(lab);
  const det=document.createElement('div');det.className='detail';
  if(f.v&&f.v.length){
    const tb=document.createElement('table');tb.className='vtab';
    f.v.forEach(r=>{const tr=document.createElement('tr');
      r.forEach(cell=>{const td=document.createElement('td');td.textContent=cell;tr.appendChild(td);});
      tb.appendChild(tr);});
    det.appendChild(tb);
  }
  if(f.tip){const tp=document.createElement('div');tp.className='tip';
    const b=document.createElement('b');b.textContent='口訣／觀念：';tp.appendChild(b);
    tp.appendChild(document.createTextNode(f.tip));det.appendChild(tp);}
  exp.addEventListener('click',()=>{
    det.classList.toggle('on');
    lab.textContent=det.classList.contains('on')?'收合代數意義':'展開代數意義';
  });
  card.appendChild(exp);card.appendChild(det);
  return card;
}
renderRead();

/* QUIZ */
const quizState=new Set();
let qNum=10;
buildChips(document.getElementById('quizChips'),quizState,()=>{});
document.querySelectorAll('#numSel button').forEach(b=>{
  b.addEventListener('click',()=>{
    document.querySelectorAll('#numSel button').forEach(x=>x.classList.remove('on'));
    b.classList.add('on');qNum=parseInt(b.dataset.n);
  });
});
document.getElementById('startQuiz').addEventListener('click',startQuiz);
let curQuiz=[];
function startQuiz(){
  let pool=Q.filter(q=>quizState.size===0||quizState.has(q.ch));
  pool=shuffle(pool.slice());
  if(qNum>0)pool=pool.slice(0,qNum);
  if(pool.length===0){alert('此章節暫無題目，請改選其他章節。');return;}
  curQuiz=pool.map(q=>({...q,pick:null}));
  document.getElementById('quizSetup').classList.add('hide');
  const run=document.getElementById('quizRun');run.classList.remove('hide');run.innerHTML='';
  curQuiz.forEach((q,i)=>{
    const card=document.createElement('div');card.className='qcard';card.dataset.i=i;
    const head=document.createElement('div');head.className='qhead';
    const s1=document.createElement('span');s1.textContent='第 '+(i+1)+' / '+curQuiz.length+' 題';
    const s2=document.createElement('span');s2.textContent=chSub(q.ch)+'｜'+chName(q.ch);
    head.appendChild(s1);head.appendChild(s2);
    const qt=document.createElement('div');qt.className='qtext';qt.textContent=q.q;
    card.appendChild(head);card.appendChild(qt);
    q.o.forEach((opt,oi)=>{
      const el=document.createElement('div');el.className='opt';
      const k=document.createElement('span');k.className='k';k.textContent='ABCD'[oi];
      el.appendChild(k);el.appendChild(document.createTextNode(opt));
      el.addEventListener('click',()=>{
        if(card.dataset.done)return;
        card.querySelectorAll('.opt').forEach(o=>o.classList.remove('sel'));
        el.classList.add('sel');q.pick=oi;
      });
      card.appendChild(el);
    });
    const exp=document.createElement('div');exp.className='exp';card.appendChild(exp);
    run.appendChild(card);
  });
  const sub=document.createElement('button');sub.className='btn';sub.textContent='交卷看分數';
  sub.addEventListener('click',gradeQuiz);run.appendChild(sub);
  const back=document.createElement('button');back.className='btn ghost';back.style.marginTop='8px';
  back.textContent='重設章節 / 題數';back.addEventListener('click',resetQuiz);run.appendChild(back);
  window.scrollTo(0,0);
}
function gradeQuiz(){
  let correct=0;
  curQuiz.forEach((q,i)=>{
    const card=document.querySelector('.qcard[data-i="'+i+'"]');
    card.dataset.done='1';
    card.querySelectorAll('.opt').forEach((o,oi)=>{
      o.style.cursor='default';
      if(oi===q.a)o.classList.add('right');
      if(q.pick===oi&&oi!==q.a)o.classList.add('wrong');
    });
    if(q.pick===q.a)correct++;
    const exp=card.querySelector('.exp');exp.classList.add('on');
    exp.innerHTML='<b>正解：'+'ABCD'[q.a]+'</b>　'+escapeHtml(q.e);
  });
  const run=document.getElementById('quizRun');
  const bar=document.createElement('div');bar.className='scorebar';
  const pct=Math.round(correct/curQuiz.length*100);
  bar.innerHTML='<div class="big">'+correct+' / '+curQuiz.length+'</div>'+
    '<div class="lbl">答對率 '+pct+'%　'+(pct>=80?'穩了 👍':pct>=60?'再衝一點':'錯題回頭看公式')+'</div>';
  run.insertBefore(bar,run.firstChild);
  document.querySelector('#quizRun .btn').classList.add('hide');
  window.scrollTo(0,0);
}
function resetQuiz(){
  document.getElementById('quizRun').classList.add('hide');
  document.getElementById('quizSetup').classList.remove('hide');
  window.scrollTo(0,0);
}

/* FLASH */
const flashState=new Set();
let cards=[],ci=0,flipped=false;
buildChips(document.getElementById('flashChips'),flashState,rebuildCards);
function rebuildCards(){
  cards=F.filter(f=>flashState.size===0||flashState.has(f.ch));
  cards=shuffle(cards.slice());ci=0;flipped=false;renderCard();
}
function renderCard(){
  const c=cards[ci];const el=document.getElementById('fcCard');
  document.getElementById('fcProg').textContent=cards.length?('第 '+(ci+1)+' / '+cards.length+' 張'):'';
  el.innerHTML='';
  if(!c){el.innerHTML='<div class="q">此範圍無公式</div>';return;}
  const side=document.createElement('div');side.className='side';
  side.textContent=flipped?'公式 ＋ 口訣':'默寫這條公式';el.appendChild(side);
  if(!flipped){
    const q=document.createElement('div');q.className='q';
    q.textContent=(c.s?'★ ':'')+c.n;el.appendChild(q);
    const sub=document.createElement('div');sub.className='hint';sub.style.marginTop='8px';
    sub.textContent=chSub(c.ch)+'｜'+chName(c.ch);el.appendChild(sub);
    const h=document.createElement('div');h.className='hint';h.style.marginTop='12px';h.style.color='var(--dim)';
    h.textContent='點一下看答案';el.appendChild(h);
  }else{
    const a=document.createElement('div');a.className='a';a.textContent=c.f;el.appendChild(a);
    if(c.tip){const t=document.createElement('div');t.className='hint';t.textContent=c.tip;el.appendChild(t);}
  }
}
document.getElementById('fcCard').addEventListener('click',()=>{flipped=!flipped;renderCard();});
document.getElementById('fcNext').addEventListener('click',()=>{if(!cards.length)return;ci=(ci+1)%cards.length;flipped=false;renderCard();});
document.getElementById('fcPrev').addEventListener('click',()=>{if(!cards.length)return;ci=(ci-1+cards.length)%cards.length;flipped=false;renderCard();});
document.getElementById('fcShuf').addEventListener('click',()=>{cards=shuffle(cards);ci=0;flipped=false;renderCard();});
rebuildCards();

function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function escapeHtml(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML;}
</script>
