<title>結構必記 · 圖卡練習</title>
<style>
:root{--bg:#efe9dc;--grid:rgba(178,164,140,.16);--panel:#fffdf8;--panel2:#f6f1e7;--line:#e3dbca;
 --ink:#2f2b24;--dim:#8c8473;--acc:#9a5a30;--acc2:#2f7d8a;--ok:#2f8f5b;--bad:#c0473f;--star:#d99a1c;
 --sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
 --mono:"Consolas","Roboto Mono","Noto Sans Mono CJK TC",monospace;}
*{box-sizing:border-box;margin:0;padding:0}
body{background:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px),var(--bg);
 background-size:22px 22px,22px 22px,auto;color:var(--ink);font-family:var(--sans);line-height:1.6;-webkit-font-smoothing:antialiased}
.wrap{max-width:820px;margin:0 auto;padding:calc(18px + env(safe-area-inset-top)) 14px 60px}
header{border-bottom:2px solid var(--acc);padding-bottom:11px;margin-bottom:14px}
h1{font-size:1.28rem;display:flex;align-items:center;gap:9px;flex-wrap:wrap}
h1 .tag{font-size:.6rem;background:var(--acc);color:#fff;padding:2px 8px;border-radius:5px;letter-spacing:1px;font-weight:700}
.sub{color:var(--dim);font-size:.8rem;margin-top:5px}
.tabs{display:flex;gap:6px;margin:14px 0 12px}
.tab{flex:1;background:var(--panel);border:1px solid var(--line);color:var(--dim);padding:10px 6px;border-radius:9px;cursor:pointer;font-size:.9rem;font-family:inherit;box-shadow:0 1px 2px rgba(90,75,50,.04)}
.tab.on{background:var(--acc);color:#fff;border-color:var(--acc);font-weight:700}
.flbl{font-size:.7rem;color:var(--dim);letter-spacing:1px;margin:6px 0 6px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.chip{background:var(--panel);border:1px solid var(--line);color:var(--dim);padding:5px 11px;border-radius:20px;font-size:.76rem;cursor:pointer;font-family:inherit}
.chip.on{background:var(--acc2);color:#fff;border-color:var(--acc2);font-weight:600}
.view{display:none}.view.on{display:block;animation:fade .2s}
@keyframes fade{from{opacity:0}to{opacity:1}}
.svgbox{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:6px 4px;text-align:center}
/* 連連看 */
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mcol{display:flex;flex-direction:column;gap:8px}
.mcard{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:7px;cursor:pointer;box-shadow:0 1px 2px rgba(90,75,50,.05);transition:.12s}
.mcard .t{font-size:.72rem;color:var(--ink);margin-bottom:3px;font-weight:600;line-height:1.3}
.mval{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 10px;cursor:pointer;font-family:var(--mono);font-size:.92rem;color:#8a3b22;text-align:center;box-shadow:0 1px 2px rgba(90,75,50,.05);display:flex;align-items:center;justify-content:center;min-height:44px}
.mcard.sel,.mval.sel{border-color:var(--acc2);background:rgba(47,125,138,.1)}
.mcard.done,.mval.done{border-color:var(--ok);background:rgba(47,143,91,.13);opacity:.65;cursor:default;pointer-events:none}
.mcard.bad,.mval.bad{border-color:var(--bad);background:rgba(192,71,63,.14);animation:shake .3s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.mstat{display:flex;justify-content:space-between;font-size:.78rem;color:var(--dim);margin-bottom:10px}
.done-banner{background:rgba(47,143,91,.13);border:1px solid var(--ok);border-radius:10px;padding:13px;text-align:center;margin-top:12px}
.done-banner b{color:var(--ok);font-size:1.05rem}
/* 填空 */
.qcard{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;box-shadow:0 1px 3px rgba(90,75,50,.06)}
.qtitle{font-size:.92rem;font-weight:700;margin-bottom:8px}
.qask{font-size:.9rem;margin:11px 0 10px}.qask b{font-family:var(--mono);color:var(--acc)}
.opt{display:block;width:100%;text-align:left;background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:11px 13px;margin-bottom:8px;cursor:pointer;font-family:var(--mono);font-size:.95rem;color:var(--ink);font-family:var(--mono)}
.opt.right{border-color:var(--ok);background:rgba(47,143,91,.14)}
.opt.wrong{border-color:var(--bad);background:rgba(192,71,63,.14)}
.qscore{font-size:.78rem;color:var(--dim);margin-bottom:10px}
.btn{background:var(--acc);color:#fff;border:none;padding:11px;border-radius:9px;font-size:.92rem;font-weight:700;cursor:pointer;width:100%;font-family:inherit;margin-top:4px}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--dim);font-weight:500}
/* 圖卡 reference */
.rcard{background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:11px 12px;margin-bottom:10px;box-shadow:0 1px 3px rgba(90,75,50,.05)}
.rtitle{font-size:.9rem;font-weight:700;margin-bottom:6px}
.rtag{font-size:.62rem;color:var(--acc);border:1px solid var(--line);border-radius:4px;padding:1px 6px;margin-right:6px}
.rvals{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.rval{font-family:var(--mono);font-size:.78rem;background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:3px 8px;color:#5a3b2a}
.rval b{color:var(--acc2)}
footer{color:var(--dim);font-size:.7rem;text-align:center;margin-top:28px;border-top:1px solid var(--line);padding-top:12px;line-height:1.7}
</style></head>
<body><div class="wrap">
<header>
 <h1>結構必記 · 圖卡練習 <span class="tag">技師備考</span></h1>
 <div class="sub">載重圖 ↔ 關鍵值｜連連看・填空・圖卡｜值採標準解與固端彎矩表</div>
</header>
<div class="tabs">
 <button class="tab on" data-m="match">連連看</button>
 <button class="tab" data-m="fill">填空</button>
 <button class="tab" data-m="ref">圖卡</button>
</div>
<div class="flbl">篩選類型</div>
<div class="chips" id="chips"></div>
<section class="view on" id="v-match">
 <div class="mstat"><span id="mProgress"></span><span id="mErr"></span></div>
 <div class="mgrid"><div class="mcol" id="mLeft"></div><div class="mcol" id="mRight"></div></div>
 <div id="mDone"></div>
</section>
<section class="view" id="v-fill"><div id="fillHost"></div></section>
<section class="view" id="v-ref"><div id="refHost"></div></section>
<footer>值採標準解與固端彎矩表（第一式／遠端鉸修正式）；正負號依「下凹為正」慣例，臨場以題目給定為準。<br>襄澤專案顧問工作室 ©</footer>
</div>
<script>
// ===== 結構載重圖 SVG 產生器（供檢查用，之後嵌入工具）=====
const AC = "#b5482e";    // 載重色
const INK = "#33302a";   // 線色

function arrowDown(x, yTop, yBot, col=INK){
  return `<line x1="${x}" y1="${yTop}" x2="${x}" y2="${yBot}" stroke="${col}" stroke-width="1.4"/>`
       + `<polygon points="${x-3},${yBot-5} ${x+3},${yBot-5} ${x},${yBot}" fill="${col}"/>`;
}
function pin(x,y){
  return `<polygon points="${x},${y} ${x-7},${y+12} ${x+7},${y+12}" fill="none" stroke="${INK}" stroke-width="1.3"/>`
       + `<line x1="${x-10}" y1="${y+12}" x2="${x+10}" y2="${y+12}" stroke="${INK}" stroke-width="1.3"/>`
       + hatch(x-10,y+12,x+10,y+12);
}
function roller(x,y){
  return `<polygon points="${x},${y} ${x-7},${y+10} ${x+7},${y+10}" fill="none" stroke="${INK}" stroke-width="1.3"/>`
       + `<circle cx="${x-4}" cy="${y+13}" r="2" fill="none" stroke="${INK}" stroke-width="1"/>`
       + `<circle cx="${x+4}" cy="${y+13}" r="2" fill="none" stroke="${INK}" stroke-width="1"/>`
       + `<line x1="${x-10}" y1="${y+16}" x2="${x+10}" y2="${y+16}" stroke="${INK}" stroke-width="1.3"/>`
       + hatch(x-10,y+16,x+10,y+16);
}
function fixed(x,y,side){ // side 'L' 牆在左, 'R' 牆在右
  let s = `<line x1="${x}" y1="${y-15}" x2="${x}" y2="${y+15}" stroke="${INK}" stroke-width="1.6"/>`;
  const dir = side==='L'? -1 : 1;
  for(let yy=y-14; yy<=y+12; yy+=5){
    s += `<line x1="${x}" y1="${yy+4}" x2="${x+dir*6}" y2="${yy}" stroke="${INK}" stroke-width="1"/>`;
  }
  return s;
}
function hatch(x1,y,x2,yy){
  let s=''; for(let x=x1; x<x2; x+=5){ s+=`<line x1="${x}" y1="${y}" x2="${x-4}" y2="${y+5}" stroke="${INK}" stroke-width="0.9"/>`; }
  return s;
}
function spring(x,y){
  // zigzag vertical from beam (y) down to ground (y+20)
  let p=`M ${x} ${y}`, n=6, top=y+2, bot=y+18, step=(bot-top)/n;
  for(let i=0;i<n;i++){ const yy=top+step*(i+1); const xx = x + (i%2===0? 6 : -6); p+=` L ${xx} ${yy-step/2}`; }
  p+=` L ${x} ${bot}`;
  return `<path d="${p}" fill="none" stroke="${INK}" stroke-width="1.2"/>`
       + `<line x1="${x-10}" y1="${bot+2}" x2="${x+10}" y2="${bot+2}" stroke="${INK}" stroke-width="1.3"/>`
       + hatch(x-10,bot+2,x+10,bot+2);
}
function udl(xa,xb,y){
  const top=y-18; let s=`<line x1="${xa}" y1="${top}" x2="${xb}" y2="${top}" stroke="${AC}" stroke-width="1.2"/>`;
  const n=Math.max(5,Math.round((xb-xa)/22));
  for(let i=0;i<=n;i++){ const x=xa+(xb-xa)*i/n; s+=arrowDown(x,top,y-3,AC); }
  s+=`<text x="${(xa+xb)/2}" y="${top-4}" font-size="11" fill="${AC}" text-anchor="middle" font-style="italic">w</text>`;
  return s;
}
function triLoad(xa,xb,y,dir){ // dir 'R': 右大; 'L': 左大
  const top=y-20; const n=8; let poly, s='';
  const hAt = t => 3 + (dir==='R'? t : (1-t))*15; // 高度
  let pts=[`${xa},${y-3}`];
  for(let i=0;i<=n;i++){ const t=i/n; const x=xa+(xb-xa)*t; const h=hAt(t); pts.push(`${x},${y-3-h}`); }
  pts.push(`${xb},${y-3}`);
  s+=`<polyline points="${pts.join(' ')}" fill="none" stroke="${AC}" stroke-width="1.1"/>`;
  for(let i=0;i<=n;i++){ const t=i/n; const x=xa+(xb-xa)*t; const h=hAt(t); if(h>4) s+=arrowDown(x,y-3-h,y-3,AC); }
  s+=`<text x="${dir==='R'?xb-8:xa+8}" y="${top-2}" font-size="11" fill="${AC}" text-anchor="middle" font-style="italic">w</text>`;
  return s;
}
function triMid(xa,xb,y){
  const xc=(xa+xb)/2, n=8; let pts=[`${xa},${y-3}`];
  for(let i=0;i<=n;i++){ const t=i/n; const x=xa+(xb-xa)*t; const h=3+ (1-Math.abs(2*t-1))*15; pts.push(`${x},${y-3-h}`); }
  pts.push(`${xb},${y-3}`);
  let s=`<polyline points="${pts.join(' ')}" fill="none" stroke="${AC}" stroke-width="1.1"/>`;
  for(let i=1;i<n;i++){ const t=i/n; const x=xa+(xb-xa)*t; const h=3+(1-Math.abs(2*t-1))*15; s+=arrowDown(x,y-3-h,y-3,AC); }
  s+=`<text x="${xc}" y="${y-24}" font-size="11" fill="${AC}" text-anchor="middle" font-style="italic">w</text>`;
  return s;
}
function pLoad(x,y,label='P'){
  return arrowDown(x,y-26,y-4,AC)+`<text x="${x+4}" y="${y-26}" font-size="11" fill="${AC}" font-style="italic">${label}</text>`;
}
function mLoad(x,y,label='M₀'){
  return `<path d="M ${x-10} ${y-8} A 10 10 0 1 1 ${x+10} ${y-8}" fill="none" stroke="${AC}" stroke-width="1.4"/>`
       + `<polygon points="${x+10},${y-8} ${x+6},${y-12} ${x+12},${y-13}" fill="${AC}"/>`
       + `<text x="${x}" y="${y-20}" font-size="11" fill="${AC}" text-anchor="middle" font-style="italic">${label}</text>`;
}
function settle(x,y){ // 沉陷 Δ 在右端
  return `<line x1="${x}" y1="${y}" x2="${x}" y2="${y+14}" stroke="${AC}" stroke-width="1" stroke-dasharray="2 2"/>`
       + `<polygon points="${x-3},${y+9} ${x+3},${y+9} ${x},${y+14}" fill="${AC}"/>`
       + `<text x="${x+5}" y="${y+12}" font-size="10" fill="${AC}">Δ</text>`;
}

function svgBeam(c){
  const W=260,H=80,y=40,xL=30,xR=230;
  let s=`<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" width="100%" style="max-width:260px">`;
  const sup=c.sup, load=c.load, spans=c.spans||1;
  if(spans===2){
    const xM=(xL+xR)/2;
    s+=`<line x1="${xL}" y1="${y}" x2="${xR}" y2="${y}" stroke="${INK}" stroke-width="2"/>`;
    [ [xL,sup[0]],[xM,sup[1]],[xR,sup[2]] ].forEach(([x,t])=>{ s+=drawSup(x,y,t, x===xL?'L':'R'); });
    if(load==='Pmid2'){ s+=pLoad((xL+xM)/2,y)+pLoad((xM+xR)/2,y); }
    else if(load==='wfull2'){ s+=udl(xL,xM,y)+udl(xM,xR,y); }
    s+=`</svg>`; return s;
  }
  // 1 span
  s+=`<line x1="${xL}" y1="${y}" x2="${xR}" y2="${y}" stroke="${INK}" stroke-width="2"/>`;
  s+=drawSup(xL,y,sup[0],'L');
  s+=drawSup(xR,y,sup[1],'R');
  const xc=(xL+xR)/2;
  if(load==='Pmid') s+=pLoad(xc,y);
  else if(load==='wfull') s+=udl(xL,xR,y);
  else if(load==='Pend') s+=pLoad(xR-2,y);
  else if(load==='Mmid') s+=mLoad(xc,y);
  else if(load==='Pab') s+=pLoad(xL+(xR-xL)*0.38,y);
  else if(load==='triR') s+=triLoad(xL,xR,y,'R');
  else if(load==='triMid') s+=triMid(xL,xR,y);
  if(c.extra==='settle') s+=settle(xR,y);
  if(c.extra==='theta') s+=mLoad(xL+14,y,'θ');
  s+=`</svg>`; return s;
}
function drawSup(x,y,t,side){
  if(t==='pin') return pin(x,y);
  if(t==='roller') return roller(x,y);
  if(t==='fixed') return fixed(x,y,side);
  if(t==='spring') return spring(x,y);
  return ''; // free
}

const $=id=>document.getElementById(id);
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

// ---- filter chips ----
const CATS=[...new Set(CASES.map(c=>c.cat))];
let curCat='全部';
function buildChips(){
 const host=$('chips');host.innerHTML='';
 ['全部',...CATS].forEach(cat=>{
  const b=document.createElement('button');b.className='chip'+(cat===curCat?' on':'');b.textContent=cat;
  b.onclick=()=>{curCat=cat;buildChips();refresh();};host.appendChild(b);
 });
}
function pool(){return curCat==='全部'?CASES:CASES.filter(c=>c.cat===curCat);}

// ---- tabs ----
let mode='match';
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{
 document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));
 document.querySelectorAll('.view').forEach(x=>x.classList.remove('on'));
 t.classList.add('on');mode=t.dataset.m;$('v-'+mode).classList.add('on');refresh();
});
function refresh(){ if(mode==='match')newMatch(); else if(mode==='fill')newFill(); else buildRef(); }

// ---- 連連看 ----
let mSel=null, mErrCount=0;
function newMatch(){
 mErrCount=0;mSel=null;$('mDone').innerHTML='';
 let p=shuffle(pool().slice());
 // distinct headline
 const seen=new Set();p=p.filter(c=>{if(seen.has(c.headline))return false;seen.add(c.headline);return true;});
 const n=Math.min(5,p.length);const round=p.slice(0,n);
 const rights=shuffle(round.map(c=>({id:c.id,headline:c.headline})));
 $('mProgress').textContent='配對 0 / '+n;
 $('mErr').textContent='錯誤 0';
 const L=$('mLeft'),R=$('mRight');L.innerHTML='';R.innerHTML='';
 round.forEach(c=>{
  const d=document.createElement('div');d.className='mcard';d.dataset.id=c.id;
  d.innerHTML='<div class="t">'+c.title+'</div><div class="svgbox">'+svgBeam(c)+'</div>';
  d.onclick=()=>selLeft(d);L.appendChild(d);
 });
 rights.forEach(r=>{
  const d=document.createElement('div');d.className='mval';d.dataset.id=r.id;d.textContent=r.headline;
  d.onclick=()=>selRight(d);R.appendChild(d);
 });
 window._matchTotal=n;window._matchDone=0;
}
function selLeft(d){ if(d.classList.contains('done'))return;
 document.querySelectorAll('#mLeft .mcard').forEach(x=>x.classList.remove('sel'));
 d.classList.add('sel');mSel=d; tryPair(); }
function selRight(d){ if(d.classList.contains('done'))return;
 document.querySelectorAll('#mRight .mval').forEach(x=>x.classList.remove('sel'));
 d.classList.add('sel'); window._selRight=d; tryPair(); }
function tryPair(){
 const l=mSel, r=window._selRight;
 if(!l||!r)return;
 if(l.dataset.id===r.dataset.id){
  l.classList.add('done');r.classList.add('done');l.classList.remove('sel');r.classList.remove('sel');
  mSel=null;window._selRight=null;window._matchDone++;
  $('mProgress').textContent='配對 '+window._matchDone+' / '+window._matchTotal;
  if(window._matchDone===window._matchTotal){
   $('mDone').innerHTML='<div class="done-banner"><b>完成！</b> 錯誤 '+mErrCount+' 次<br><button class="btn" style="margin-top:10px" onclick="newMatch()">下一輪 →</button></div>';
  }
 } else {
  mErrCount++;$('mErr').textContent='錯誤 '+mErrCount;
  l.classList.add('bad');r.classList.add('bad');
  const a=l,b=r;setTimeout(()=>{a.classList.remove('bad','sel');b.classList.remove('bad','sel');},320);
  mSel=null;window._selRight=null;
 }
}

// ---- 填空 ----
let fillScore=0, fillTotal=0;
function pickDistractors(ans,type,n){
 const p=(POOLS[type]||POOLS.M).filter(v=>v!==ans);
 return shuffle(p).slice(0,n);
}
function newFill(){
 const p=pool();const c=p[Math.floor(Math.random()*p.length)];
 const bl=c.blanks[Math.floor(Math.random()*c.blanks.length)];
 const [label,ans,type]=bl;
 const opts=shuffle([ans,...pickDistractors(ans,type,3)]);
 const host=$('fillHost');
 host.innerHTML='<div class="qscore">得分 '+fillScore+' / '+fillTotal+'</div>'+
  '<div class="qcard"><div class="qtitle">'+c.title+'</div>'+
  '<div class="svgbox">'+svgBeam(c)+'</div>'+
  '<div class="qask">求 <b>'+label+'</b> = ？</div>'+
  '<div id="optHost"></div></div>';
 const oh=$('optHost');
 opts.forEach(o=>{
  const b=document.createElement('button');b.className='opt';b.textContent=o;
  b.onclick=()=>{
   if(oh.dataset.done)return;oh.dataset.done='1';fillTotal++;
   const btns=oh.querySelectorAll('.opt');
   btns.forEach(x=>{if(x.textContent===ans)x.classList.add('right');});
   if(o===ans){fillScore++;} else {b.classList.add('wrong');}
   const nx=document.createElement('button');nx.className='btn';nx.textContent='下一題 →';nx.style.marginTop='8px';
   nx.onclick=newFill;oh.appendChild(nx);
   $('fillHost').querySelector('.qscore').textContent='得分 '+fillScore+' / '+fillTotal;
  };
  oh.appendChild(b);
 });
}

// ---- 圖卡 reference ----
function buildRef(){

 pool().forEach(c=>{
  const vals=c.blanks.map(b=>'<span class="rval"><b>'+b[0]+'</b> = '+b[1]+'</span>').join('');
  const d=document.createElement('div');d.className='rcard';
  d.innerHTML='<div class="rtitle"><span class="rtag">'+c.cat+'</span>'+c.title+'</div>'+
   '<div class="svgbox">'+svgBeam(c)+'</div><div class="rvals">'+vals+'</div>';
  host.appendChild(d);
 });
}
