<style>
:root{--bg:#efe9dc;--paper:#faf6ee;--ink:#2b2118;--dim:#7a6a58;--line:#dccfb8;--acc:#bd5530;--acc-soft:#f3dccf;--teal:#2f7d8a;--teal-soft:#dcebec;--ok:#3f7d4a;--ok-soft:#dcebd9;--bad:#b23a2a;--bad-soft:#f5d7d1;--star:#c9901c;
--sans:"PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.65;font-size:16px;
padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
.wrap{max-width:760px;margin:0 auto;padding:14px 14px 40px}
header h1{font-size:21px;font-weight:800;letter-spacing:.02em}
header p{font-size:13px;color:var(--dim)}
.top{position:sticky;top:0;z-index:5;background:var(--bg);padding-top:10px;margin:0 -14px;padding-left:14px;padding-right:14px;border-bottom:1px solid var(--line)}
.modes{display:grid;grid-template-columns:repeat(3,1fr);background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px;margin:10px 0 8px}
.modes button{padding:8px 0;border-radius:9px;font-weight:700;color:var(--dim)}
.modes button.on{background:var(--acc);color:#fff}
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;padding:5px 11px;border-radius:999px;border:1px solid var(--line);background:var(--paper);font-size:14px;white-space:nowrap}
.chip b{color:var(--acc);font-weight:700;margin-right:3px}
.chip.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.chip.on b{color:#f0b89e}
.bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:12px 0}
.tog{padding:5px 10px;border-radius:8px;border:1px solid var(--line);background:var(--paper);font-size:13px}
.tog.on{background:var(--teal);border-color:var(--teal);color:#fff}
.meta{font-size:13px;color:var(--dim);margin-left:auto}
/* read */
.sec-h{margin:22px 0 8px;font-size:17px;font-weight:800;display:flex;gap:8px;align-items:baseline}
.sec-h span{color:var(--acc)}
.item{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px}
.item h3{font-size:15.5px;font-weight:700;margin-bottom:6px}
.star{color:var(--star);margin-right:4px}
ul.ans{list-style:none}
ul.ans li{position:relative;padding-left:14px;margin:3px 0;font-size:15px}
ul.ans li::before{content:"";position:absolute;left:2px;top:.72em;width:5px;height:5px;border-radius:50%;background:var(--acc)}
.memo{margin-top:8px;padding:6px 10px;border-radius:8px;background:var(--teal-soft);color:#1f5761;font-size:14px;font-weight:600}
.tw{overflow-x:auto;margin:6px 0}
table{border-collapse:collapse;font-size:13.5px;min-width:100%}
th,td{border:1px solid var(--line);padding:5px 7px;text-align:left;vertical-align:top}
th{background:#efe4d2;font-weight:700;white-space:nowrap}
td:first-child{font-weight:600;white-space:nowrap}
/* flashcard */
.fc{background:var(--paper);border:1px solid var(--line);border-radius:16px;min-height:300px;padding:18px 16px;display:flex;flex-direction:column;cursor:pointer;box-shadow:0 2px 0 var(--line)}
.fc .tag{font-size:12.5px;color:var(--dim);display:flex;justify-content:space-between}
.fc .q{font-size:19px;font-weight:800;margin:auto 0;padding:18px 0;line-height:1.5}
.fc.back .q{font-size:15px;color:var(--dim);font-weight:700;margin:10px 0 6px;padding:0 0 8px;border-bottom:1px dashed var(--line)}
.fc .hint{font-size:13px;color:var(--dim);text-align:center}
.st{font-size:12px;padding:1px 7px;border-radius:6px}
.st.k{background:var(--ok-soft);color:var(--ok)}.st.w{background:var(--bad-soft);color:var(--bad)}
.acts{display:grid;grid-template-columns:52px 1fr 1fr 52px;gap:8px;margin-top:12px}
.acts button{padding:12px 0;border-radius:12px;font-weight:700;border:1px solid var(--line);background:var(--paper)}
.acts .w{background:var(--bad-soft);border-color:#e9b9ae;color:var(--bad)}
.acts .k{background:var(--ok-soft);border-color:#b9d3b4;color:var(--ok)}
.prog{height:5px;background:var(--line);border-radius:3px;overflow:hidden;margin:4px 0 12px}
.prog i{display:block;height:100%;background:var(--acc)}
.empty{padding:40px 10px;text-align:center;color:var(--dim)}
/* quiz */
.qz{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:16px}

[8,0,"拌和水量、含氣量、水灰比如何決定？",["拌和水量及含氣量：由坍度及 Dmax 查表","同一坍度下，Dmax 愈大 → 拌和水愈少、含氣量愈小","W/C：滿足目標強度者與滿足耐久性者，取較小值","水泥用量＝拌和水量／W/C；膠結料減去卜作嵐即水泥"],""],

[9,1,"高性能混凝土的定義與材料要求？",["定義：坍度 25±2 cm，45 分鐘後仍保持 23 cm；56 天抗壓 ≥560 kgf/cm²","水泥細度 3500~4000 cm²/g；緻密配比（骨材最多、空隙最少）；細骨材用粗砂 FM 2.8~3.1","卜作嵐（減水化熱、改善界面、減水泥）＋強塑劑（減水保工作性）","配比：低水膠比但高水灰比；以 56 天為設計齡期","應用：高雄 85 層國際廣場大樓"],"低 W/B、高 W/C"],

[10,1,"內部振動器的使用要點與充分搗實判斷？",["垂直緩慢插入，上下振動 5~15 秒；深入新澆層底部，下層仍塑性時貫入下層約 10 cm","插入間距不超過 45 cm，範圍交互重疊；不可橫移或用來移動混凝土","距模板約 8 cm，避免觸及鋼筋","充分搗實判斷：無氣泡上升；搗實聲音不再變化；模板邊、鋼筋四周、振動器周圍砂漿充溢"],"5~15 秒、10 cm、45 cm、8 cm"],
[10,1,"養護時間規定與影響養護品質的因素？",["一般混凝土至少 7 日或達 f'c 的 70%；無筋巨積至少 14 天，加矽灰者 21 天","濕度：RH <80% 產生塑性收縮、水化停止","溫度：愈高早強愈高、長強降低","時間：愈長強度愈高，超過 7 天成長緩慢","間歇養護：乾濕反覆，內部產生裂縫，強度下降"],"7 天／巨積 14／矽灰 21"],

[11,1,"瀝青材料依原料的分類？",["瀝青材料 → 瀝青、柏油","瀝青 → 天然瀝青（湖瀝青、岩瀝青、砂瀝青、山瀝青）、石油瀝青","石油瀝青 → 直餾瀝青（瀝青膏、油溶瀝青、乳化瀝青）、吹製瀝青","柏油 → 直餾柏油、油溶柏油"],""],
[11,1,"直餾瀝青與吹製瀝青的製法與性質比較？",["直餾：原油大氣常壓分餾後，殘渣再真空蒸氣分餾，處理得直餾瀝青（瀝青膠泥）","吹製：瀝青膠泥加熱至 400~500°F 吹入空氣，碳氫化合物聚合縮合為高分子","T:性質|直餾|吹製;針入度|大|小;軟化點|低|高;閃火點|高|低;延展性|大|小;感溫性|大|小;黏度|大|小;耐久性|小|大"],"吹製：硬、耐熱、耐久；直餾：軟、黏、易延展"],
[11,1,"油溶瀝青的目的與三類？",["目的：改善瀝青低溫時凝結過速","RC 速凝：針入度 85~100 膠泥＋汽油或石腦油","MC 中凝：針入度 120~150 膠泥＋煤油（或柴油）","SC 慢凝：黏度大的殘渣油或與不易揮發油混合，亦稱道路油"],"汽油快、煤油中、殘渣油慢"],
[11,1,"乳化瀝青的目的與三類？",["目的：改善雨天無法施工","陰離子：鹼性水溶液＋乳化劑（高級脂肪酸肥皂），顆粒帶負電，適合帶正電的碳酸岩粒料","陽離子：陽離子活性劑＋醋酸成酸性溶液，顆粒帶正電，適合陰雨及矽酸岩粒料；多數骨材表面帶負電，應用最廣","粘土型：適用於電解質骨材"],"異電相吸；陽離子最廣"],
[11,0,"焦油與瀝青的比較？",["焦油低溫較脆；浸透力較大；遇熱較易軟化；毒性較強；氣味較刺激","瀝青折斷面有光澤，焦油無；瀝青黏結力較強","焦油不溶於石油溶劑；瀝青可溶於石油、CS₂、CCl₄、苯，不溶於水及酸鹼"],""],

[14,"耐久美觀但耐火性差、應用最廣的岩石？",["花崗岩","石灰岩","砂岩","大理石"],0,"花崗岩。"],
[14,"CNS 382 二種磚的吸水率與抗壓強度？",["≤10%、≥300","≤13%、≥200","≤15%、≥150","≤13%、≥150"],1,"一種 10%/300、二種 13%/200、三種 15%/150。"],
[14,"台灣區普通磚尺寸？",["230×110×60 mm","200×95×53 mm","210×100×60 mm","190×90×57 mm"],1,"大陸區 230×110×60。"],
[14,"最有效的木材防腐方法？",["表面碳化法","藥劑塗佈法","藥劑注入法","高溫殺菌法"],2,"加壓注入防腐劑最有效。"]
];

const $=s=>document.querySelector(s);
const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;');
const KEY='em16_v1';
let st={mode:'card',sec:-1,star:false,weakOnly:false,shuffle:false,known:{},weak:{}};
try{const s=JSON.parse(localStorage.getItem(KEY)||'{}');Object.assign(st,s);}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify({mode:st.mode,sec:st.sec,star:st.star,weakOnly:st.weakOnly,shuffle:st.shuffle,known:st.known,weak:st.weak}))}catch(e){}}
CARDS.forEach((c,i)=>c.id=i);
function renderAns(lines){let h='',li=[];const flush=()=>{if(li.length){h+='<ul class="ans">'+li.join('')+'</ul>';li=[];}};
 lines.forEach(l=>{if(l.startsWith('T:')){flush();const rows=l.slice(2).split(';').map(r=>r.split('|'));
  h+='<div class="tw"><table><tr>'+rows[0].map(x=>'<th>'+esc(x)+'</th>').join('')+'</tr>'+rows.slice(1).map(r=>'<tr>'+r.map(x=>'<td>'+esc(x)+'</td>').join('')+'</tr>').join('')+'</table></div>';}
  else li.push('<li>'+esc(l)+'</li>');});flush();return h;}
function memo(c){return c[4]?'<div class="memo">記：'+esc(c[4])+'</div>':''}
function secLabel(i){return SECS[i][0]+' '+SECS[i][1]}
function pool(){return CARDS.filter(c=>(st.sec<0||c[0]===st.sec)&&(!st.star||c[1]))}
function chips(){$('#chips').innerHTML=[['全部',-1]].concat(SECS.map((s,i)=>[s,i])).map(([s,i])=>
 '<button class="chip'+(st.sec===i?' on':'')+'" data-s="'+i+'">'+(i<0?'全部':'<b>'+s[0].slice(3)+'</b>'+s[1])+'</button>').join('');
 const on=$('#chips .chip.on');if(on)on.scrollIntoView({inline:'center',block:'nearest'});}
$('#chips').onclick=e=>{const b=e.target.closest('.chip');if(!b)return;st.sec=+b.dataset.s;fc.i=0;fc.flip=false;fc.order=null;qz=null;save();render();};
$('#modes').onclick=e=>{const b=e.target.closest('button');if(!b)return;st.mode=b.dataset.m;save();render();};
// ---- read
function read(){const p=pool();let h=bar(false),last=-2;
 if(!p.length)return h+'<div class="empty">這個範圍沒有 ★ 卡片，關掉「只看 ★」試試。</div>';
 p.forEach(c=>{if(c[0]!==last){last=c[0];h+='<div class="sec-h"><span>'+SECS[c[0]][0]+'</span>'+SECS[c[0]][1]+'</div>';}
  h+='<div class="item"><h3>'+(c[1]?'<span class="star">★</span>':'')+esc(c[2])+'</h3>'+renderAns(c[3])+memo(c)+'</div>';});return h;}
function bar(card){return '<div class="bar"><button class="tog'+(st.star?' on':'')+'" data-t="star">只看 ★</button>'+
 (card?'<button class="tog'+(st.weakOnly?' on':'')+'" data-t="weakOnly">只練不熟</button><button class="tog'+(st.shuffle?' on':'')+'" data-t="shuffle">洗牌</button>':'')+
 '<span class="meta" id="meta"></span></div>';}
// ---- card
const fc={i:0,flip:false,order:null};
function deck(){let p=pool();if(st.weakOnly)p=p.filter(c=>st.weak[c.id]);
 const key=p.map(c=>c.id).join(',')+st.shuffle;
 if(!fc.order||fc.key!==key){fc.key=key;fc.order=p.map(c=>c.id);if(st.shuffle){for(let i=fc.order.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[fc.order[i],fc.order[j]]=[fc.order[j],fc.order[i]];}}if(fc.i>=fc.order.length)fc.i=0;}
 return fc.order;}
function card(){const d=deck();let h=bar(true);
 const all=pool(),kn=all.filter(c=>st.known[c.id]).length,wk=all.filter(c=>st.weak[c.id]).length;
 if(!d.length)return h+'<div class="empty">'+(st.weakOnly?'沒有標為「不熟」的卡片了，這個範圍都記住了。':'這個範圍沒有卡片。')+'</div>';
 const c=CARDS[d[fc.i]],s=st.known[c.id]?'<span class="st k">記住了</span>':st.weak[c.id]?'<span class="st w">不熟</span>':'';
 h+='<div class="prog"><i style="width:'+((fc.i+1)/d.length*100)+'%"></i></div>';
 h+='<div class="fc'+(fc.flip?' back':'')+'" id="fc"><div class="tag"><span>'+(c[1]?'<span class="star">★</span>':'')+secLabel(c[0])+'</span>'+s+'</div>'+
  '<div class="q">'+esc(c[2])+'</div>'+(fc.flip?renderAns(c[3])+memo(c):'<div class="hint">點一下看答案</div>')+'</div>';
 h+='<div class="acts"><button data-a="prev" aria-label="上一張">‹</button><button class="w" data-a="w">不熟</button><button class="k" data-a="k">記住了</button><button data-a="next" aria-label="下一張">›</button></div>';
 h+='<div class="bar"><span class="meta" style="margin:0">第 '+(fc.i+1)+'／'+d.length+' 張｜本範圍記住 '+kn+'、不熟 '+wk+'（共 '+all.length+'）</span><button class="tog" data-a="reset" style="margin-left:auto">清除本範圍標記</button></div>';
 return h;}
function move(n){const d=deck();fc.i=(fc.i+n+d.length)%d.length;fc.flip=false;render();}
// ---- quiz
let qz=null;
function qpool(){return QUIZ.filter(q=>st.sec<0||q[0]===st.sec)}
function newQuiz(list){const src=(list||qpool()).slice();for(let i=src.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[src[i],src[j]]=[src[j],src[i]];}
 const qs=(list?src:src.slice(0,st.sec<0?15:src.length)).map(q=>{const o=q[2].map((t,i)=>({t,c:i===q[3]}));for(let i=o.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[o[i],o[j]]=[o[j],o[i]];}return{q,o};});
 qz={qs,i:0,pick:null,right:0,wrong:[]};}
function quiz(){if(!qz)newQuiz();let h='<div class="bar"><span class="meta" style="margin:0">'+(st.sec<0?'全部範圍隨機 15 題':secLabel(st.sec)+'｜共 '+qz.qs.length+' 題')+'</span></div>';
 if(qz.i>=qz.qs.length){const n=qz.qs.length;h+='<div class="qz score"><div class="n">'+qz.right+'／'+n+'</div><div>答對率 '+Math.round(qz.right/n*100)+'%</div></div>';
  if(qz.wrong.length){h+='<button class="btn" data-q="retry">重考答錯的 '+qz.wrong.length+' 題</button><div class="wrong"><div class="sec-h">答錯的題目</div>'+
   qz.wrong.map(q=>'<div class="item"><h3>'+esc(q[1])+'</h3><ul class="ans"><li>正解：'+esc(q[2][q[3]])+'</li><li>'+esc(q[4])+'</li></ul></div>').join('')+'</div>';}
  return h+'<button class="btn sub" data-q="again">再來一輪</button>';}
 const it=qz.qs[qz.i],q=it.q;
 h+='<div class="prog"><i style="width:'+(qz.i/qz.qs.length*100)+'%"></i></div><div class="qz"><div class="tag" style="font-size:12.5px;color:var(--dim)">第 '+(qz.i+1)+' 題｜'+secLabel(q[0])+'</div><div class="qt">'+esc(q[1])+'</div>';
 it.o.forEach((o,k)=>{let cl='';if(qz.pick!==null){if(o.c)cl=' c';else if(k===qz.pick)cl=' x';}h+='<button class="opt'+cl+'" data-o="'+k+'"'+(qz.pick!==null?' disabled':'')+'>'+'ABCD'[k]+'. '+esc(o.t)+'</button>';});
 if(qz.pick!==null){const ok=it.o[qz.pick].c;h+='<div class="fb '+(ok?'ok':'no')+'"><b>'+(ok?'答對了。':'答錯了，正解是 '+esc(q[2][q[3]])+'。')+'</b>'+esc(q[4])+'</div><button class="btn" data-q="next">'+(qz.i+1<qz.qs.length?'下一題':'看成績')+'</button>';}
 return h+'</div>';}
// ---- events
$('#main').onclick=e=>{const t=e.target.closest('[data-t],[data-a],[data-o],[data-q],#fc');if(!t)return;
 if(t.dataset.t){st[t.dataset.t]=!st[t.dataset.t];fc.i=0;fc.flip=false;save();render();return;}
 if(t.id==='fc'){fc.flip=!fc.flip;render();return;}
 const a=t.dataset.a;
 if(a==='prev')return move(-1);if(a==='next')return move(1);
 if(a==='k'||a==='w'){const c=CARDS[deck()[fc.i]];if(a==='k'){st.known[c.id]=1;delete st.weak[c.id];}else{st.weak[c.id]=1;delete st.known[c.id];}save();
  if(st.weakOnly&&a==='k'){fc.order=null;fc.flip=false;render();}else move(1);return;}
 if(a==='reset'){if(!confirm('清除這個範圍所有「記住了／不熟」標記？'))return;pool().forEach(c=>{delete st.known[c.id];delete st.weak[c.id];});fc.order=null;fc.i=0;save();render();return;}
 if(t.dataset.o!==undefined){if(qz.pick!==null)return;qz.pick=+t.dataset.o;const it=qz.qs[qz.i];if(it.o[qz.pick].c)qz.right++;else qz.wrong.push(it.q);render();return;}
 const q=t.dataset.q;if(q==='next'){qz.i++;qz.pick=null;render();window.scrollTo(0,0);}else if(q==='again'){newQuiz();render();}else if(q==='retry'){newQuiz(qz.wrong);render();}
};
document.addEventListener('keydown',e=>{if(st.mode!=='card')return;if(e.key==='ArrowRight')move(1);else if(e.key==='ArrowLeft')move(-1);else if(e.key===' '){e.preventDefault();fc.flip=!fc.flip;render();}});
let tx=null;$('#main').addEventListener('touchstart',e=>{if(e.target.closest('#fc'))tx=e.touches[0].clientX;},{passive:true});
$('#main').addEventListener('touchend',e=>{if(tx===null)return;const dx=e.changedTouches[0].clientX-tx;tx=null;if(Math.abs(dx)>60){e.preventDefault();move(dx<0?1:-1);}});
function render(){document.querySelectorAll('#modes button').forEach(b=>b.classList.toggle('on',b.dataset.m===st.mode));chips();
 $('#main').innerHTML=st.mode==='read'?read():st.mode==='card'?card():quiz();
 const m=$('#meta');if(m&&st.mode==='read')m.textContent=pool().length+' 張';}
render();
</script>
</body>
</html>
